- name: Install nodejs and npm
  become: true
  apt:
    name: ["nodejs", "npm"]
  tags:
    - ubuntu

- name: Install N
  become: true
  npm:
    name: n
    global: true
  tags:
    - ubuntu

- name: Install correct version of Node for ubuntu
  become: true
  shell: n 20
  tags:
    - ubuntu

- name: Install Typescript
  become: true
  npm:
    name: typescript
    global: true
